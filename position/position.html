<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>position</title>
</head>
<style>
  body {
    height: 20000px;
  }
  .parent {
    width: 300px;
    height: 300px;
    background: yellow;
    /* margin: 30px; */
    position: relative;
    top: 0;
    left: 0;
  }

  /* position: relative 는 내 원래의 위치를 기준으로 이동 */
  /* position: absolute 는 부모 기준으로 이동 */
  /* 단, 내 조상 중 position: relative 로 선언된 곳이 기준 */
  .child {
    width: 50px;
    height: 50px;
    background: green;
    /* position: relative;  */
    /* 조상 중 parent에는 position: relative가 없기 때문에 body 기준으로 움직임 */
    position: absolute; 
    top: 100px;
    left: 100px;
  }
  /* position: fixed : 카톡상담채널처럼 스크롤해도 따라다니는 기능*/
  .fixed {
    position: fixed;
    width: 50px;
    height: 50px;
    top: 10px;
    left: 400px;
    background: red;
  }

  /* position: sticky : 상단의 메뉴 또는 테이블의 헤더에 많이 사용하는 속성 */
  .sticky {
    position: sticky;
    /* width: 50px;
    height: 50px; */
    top: 0;
    background: black;
    color: white;
  }
</style>
<body>
  <div class="parent">
    <div class="child">

    </div>
  </div>
  <div class="sticky">sticky</div>
  <div class="fixed">fixed</div>
  <p>스크롤 해 보세요.</p>
</body>
</html>
